[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "friday-robot"
version = "0.1.0"
description = "Runtime embarqué sûr du robot Friday AlphaBot2-Pi"
requires-python = ">=3.11"

[project.scripts]
friday-robot = "friday_robot.__main__:main"
friday-wake-agent = "friday_robot.wake_server:main"

[tool.setuptools]
packages = ["friday_robot"]
